[workspace]
members = ["verifier"]
resolver = "3"

# SLH-DSA verification is generic code over SHA-256. Unoptimized, a debug-build
# check takes seconds, which makes the tests slow. Release builds are unaffected.
[profile.dev.package.slh-dsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.hybrid-array]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3
